[workspace]
resolver = "3"
members = ["mirage", "miragectl"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bytes = { version = "1.11", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
eyre = "0.6"
figment = { version = "0.10", features = ["env", "json", "tempfile", "toml"] }
futures = "0.3.32"
glob = "0.3"
minijinja = { version = "2.21", features = ["json", "loader"] }
mlua = { version = "0.11", features = ["async", "luau", "luau-jit", "send"] }
notify = "8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellexpand = "3.1"
tempfile = "3.27"
tokio = {
  version = "1",
  features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
    "tracing"
  ]
}
tokio-util = { version = "0.7.18", features = ["codec"] }
toml = "1.1"
toml_edit = { version = "0.25", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
