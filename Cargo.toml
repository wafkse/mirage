[workspace]
resolver = "3"
members = ["mirage", "miragectl"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bytes = { version = "1.11", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
eyre = "0.6"
figment = { version = "0.10", features = ["tempfile", "toml", "env", "json"] }
glob = "0.3"
notify = "8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
tera = "1.20"
tokio = { version = "1", features = ["signal", "net", "fs", "macros", "tracing", "time", "sync", "rt-multi-thread", "process", "io-util"] }
toml = "1.1"
walkdir = "2.5"
